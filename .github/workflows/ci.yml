# The workspace is checked on Linux, and the server's Credential Manager side, which only compiles for
# Windows, on Windows, where its tests write and delete credentials of their own. A merged
# `chore: release vX` commit is tagged and released with the client for Linux and the server for
# Windows, each built on its own arch's runner.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  rust:
    uses: SvarogLab/.github/.github/workflows/rust.yml@v1
    with:
      binaries: credrelay-client
      build-args: -p credrelay-client
      # The client's tests run the service on a private bus and read replies back with busctl.
      apt-packages: dbus-daemon systemd
      windows-args: -p credrelay-server
      windows-binaries: credrelay-server

  tag:
    needs: rust
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: SvarogLab/.github/.github/workflows/tag-release.yml@v1
    permissions:
      contents: write

  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    uses: SvarogLab/.github/.github/workflows/release.yml@v1
    permissions:
      contents: write
    with:
      tag: ${{ needs.tag.outputs.tag }}
      download-binaries: true
      prepare: |
        cp binaries/amd64/release/credrelay-client credrelay-client-linux-amd64
        cp binaries/arm64/release/credrelay-client credrelay-client-linux-arm64
        cp binaries/windows-amd64/release/credrelay-server.exe credrelay-server-windows-amd64.exe
        cp binaries/windows-arm64/release/credrelay-server.exe credrelay-server-windows-arm64.exe
        sha256sum credrelay-client-linux-* credrelay-server-windows-* > SHA256SUMS
      assets: >-
        credrelay-client-linux-amd64 credrelay-client-linux-arm64
        credrelay-server-windows-amd64.exe credrelay-server-windows-arm64.exe
        SHA256SUMS
