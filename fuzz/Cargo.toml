[package]
name = "credrelay-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
credrelay-client = { path = "../client" }

# Not a member of the credrelay workspace: it builds on nightly only, under cargo fuzz.
[workspace]

[[bin]]
name = "native_target"
path = "fuzz_targets/native_target.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dh_session"
path = "fuzz_targets/dh_session.rs"
test = false
doc = false
bench = false
