[workspace]
resolver = "3"
members = ["protocol", "server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/SvarogLab/credrelay"
description = "Serves the freedesktop Secret Service on WSL from the Windows Credential Manager, so Linux gh and glab share their tokens with the Windows builds"

[workspace.dependencies]
credrelay-protocol = { path = "protocol" }
tokio = { version = "1.54", features = ["full"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0.21"
clap = { version = "4.6.7", features = ["derive"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
