# The Linux run. The Windows-only code doesn't build here; .cargo/mutants-windows.toml mutates it on
# Windows instead.

# Under the build directory, which is ignored already.
output = "target"

exclude_globs = [
    # Builds only for Windows.
    "wincred/src/store.rs",
    "server/src/store.rs",
    "keyring/src/backend/credential_manager.rs",
    # Shared by the tests; nothing ships it.
    "client/src/test_support.rs",
]

exclude_re = [
    # Builds only for Windows.
    "^server/src/main.rs:.*: replace run -> ExitCode",
    # The default object path is `/`, the very path these return.
    "replace no_prompt -> OwnedObjectPath with Default::default\\(\\)",
    "replace Service::lock -> \\(Vec<OwnedObjectPath>, OwnedObjectPath\\) with \\(vec!\\[\\], Default::default\\(\\)\\)",
    # Every prefix of the scheme's own starts with the empty one, so listing it lists them all,
    # as no search prefix does.
    "replace Scheme::search_prefix -> Option<String> with Some\\(String::new\\(\\)\\)",
]
